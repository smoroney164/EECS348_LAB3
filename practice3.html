<!DOCTYPE html>

<html lang="en">

<head>
    <title>Password Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: lightpink;
        }

        .password-box {
            max-width: 400px;
            padding: 25px;
            background-color: white;
            border: 2px solid deeppink;
            border-radius: 15px;
        }

        input {
            margin: 8px 0;
            padding: 8px;
            width: 250px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: deeppink;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .back-button {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 18px;
    background-color: #7e22ce;
    color: white;
    border-radius: 15px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

.back-button:hover {
    background-color: #a855f7;
    transform: translateY(-2px);
    box-shadow: 0 5px 10px rgba(88, 28, 135, 0.25);
}
    </style>
</head>

<body>
    <div class="password-box">
        <h1>Password Verification</h1>
        <a class="back-button" href="index.html">Back to Home</a>

        <p>
            Enter the same password twice. The password must contain
            at least eight characters.
        </p>

        <label for="passwordOne">Enter password:</label>

        <br>

        <input type="password" id="passwordOne">

        <br>

        <label for="passwordTwo">Enter password again:</label>

        <br>

        <input type="password" id="passwordTwo">

        <br>

        <button type="button" onclick="verifyPasswords()">
            Verify Passwords
        </button>
    </div>

    <script>
        function verifyPasswords() {
            const passwordOne =
                document.getElementById("passwordOne").value;

            const passwordTwo =
                document.getElementById("passwordTwo").value;

            if (passwordOne.length < 8) {
                alert("The password must be at least eight characters long.");
            }
            else if (passwordOne !== passwordTwo) {
                alert("The passwords do not match.");
            }
            else {
                alert("The passwords match!");
            }
        }
    </script>
</body>

</html>
